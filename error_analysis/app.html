<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error Analysis — Ask Acme</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --ink: #1c1c1a; --muted: #6b6b66;
    --line: #e2e2dd; --accent: #2f6f4f; --err: #b3261e; --ok: #2f6f4f;
    --chip: #efefe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18; --panel: #232321; --ink: #ececea; --muted: #9a9a94;
      --line: #35352f; --accent: #7fc4a0; --err: #f2a6a0; --ok: #7fc4a0;
      --chip: #2e2e2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 10px 16px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { flex: 1; min-width: 100px; height: 5px; background: var(--chip); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .filters { display: flex; gap: 4px; }
  .filters button, .ghost {
    font: inherit; padding: 3px 9px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer;
  }
  .filters button[aria-pressed="true"] { background: var(--chip); color: var(--ink); }
  .layout { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 47px); }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } aside { max-height: 230px; } }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .row {
    padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: grid; grid-template-columns: 9px 1fr; gap: 9px; align-items: start;
  }
  .row:hover { background: var(--chip); }
  .row[aria-current="true"] { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--line); }
  .dot.error { background: var(--err); }
  .dot.ok { background: var(--ok); }
  .row .rid { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .rq { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  main { padding: 18px 22px 60px; max-width: 900px; }
  .label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 13px 15px; margin-bottom: 15px; }
  .query { font-size: 16px; font-weight: 600; margin: 0 0 7px; }
  .probe { color: var(--muted); font-style: italic; }
  pre.resp { white-space: pre-wrap; word-wrap: break-word; margin: 0; font: inherit; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .tool { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; padding: 3px 0; }
  .tool b { font-weight: 600; }
  .tool span { color: var(--muted); }
  .verdicts { display: flex; gap: 7px; margin-bottom: 12px; }
  .verdicts button {
    font: inherit; padding: 6px 13px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
  }
  .verdicts button[aria-pressed="true"][data-v="error"] { background: var(--err); border-color: var(--err); color: #fff; }
  .verdicts button[aria-pressed="true"][data-v="ok"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  textarea {
    width: 100%; min-height: 105px; resize: vertical; padding: 10px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--bg);
    color: var(--ink); font: inherit;
  }
  textarea:focus, .verdicts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .saved { font-size: 12px; color: var(--muted); height: 16px; margin-top: 5px; }
  .nav { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
  kbd { font: 11px ui-monospace, monospace; background: var(--chip); border: 1px solid var(--line);
        border-radius: 4px; padding: 1px 5px; }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  .exportbar { display: flex; align-items: center; gap: 4px; }
  .exportmsg { font-size: 12px; color: var(--muted); min-width: 90px; }
  select.ghost { padding: 4px 6px; }
  .empty { color: var(--muted); padding: 40px 0; }
  .agent-error { border-left: 3px solid var(--err); padding-left: 10px; color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>Error Analysis</h1>
  <div class="bar"><i id="barfill"></i></div>
  <div class="progress" id="progress">—</div>
  <div class="filters">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="todo" aria-pressed="false">Unreviewed</button>
    <button data-f="error" aria-pressed="false">Errors</button>
  </div>
  <span class="exportbar">
    <select id="scope" class="ghost" title="What to export">
      <option value="reviewed">Reviewed</option>
      <option value="errors">Errors only</option>
    </select>
    <button class="ghost" data-export="csv">CSV</button>
    <button class="ghost" data-export="json">JSON</button>
    <button class="ghost" data-export="md">MD</button>
    <button class="ghost" id="copy">Copy</button>
    <span id="exportmsg" class="exportmsg"></span>
  </span>
</header>

<div class="layout">
  <aside id="list"></aside>
  <main id="detail"><p class="empty">Loading…</p></main>
</div>

<script>
let traces = [], ann = {}, cur = 0, filter = "all";
const timers = {};

const $ = s => document.querySelector(s);
const annOf = id => ann[id] || { verdict: "", note: "" };
const isReviewed = id => {
  const a = ann[id];
  return !!(a && (a.verdict || (a.note || "").trim()));
};

function visible() {
  if (filter === "todo")  return traces.filter(t => !isReviewed(t.id));
  if (filter === "error") return traces.filter(t => annOf(t.id).verdict === "error");
  return traces;
}

function updateProgress() {
  const done = traces.filter(t => isReviewed(t.id)).length;
  const errs = traces.filter(t => annOf(t.id).verdict === "error").length;
  $("#progress").textContent = `${done}/${traces.length} reviewed · ${errs} errors`;
  $("#barfill").style.width = traces.length ? (done / traces.length * 100) + "%" : "0";
}

function dotClass(id) {
  const v = annOf(id).verdict;
  return v === "error" ? "dot error" : v === "ok" ? "dot ok" : "dot";
}

function renderList() {
  const list = $("#list"), rows = visible();
  list.innerHTML = "";
  if (!rows.length) {
    list.innerHTML = '<p class="empty" style="padding:16px">Nothing matches this filter.</p>';
    return;
  }
  rows.forEach(t => {
    const el = document.createElement("div");
    el.className = "row";
    el.dataset.id = t.id;
    el.setAttribute("aria-current", String(traces[cur] && traces[cur].id === t.id));
    el.innerHTML = `<span class="${dotClass(t.id)}"></span>
      <span><span class="rid">${t.id}</span><br><span class="rq"></span></span>`;
    el.querySelector(".rq").textContent = t.query;
    el.onclick = () => { cur = traces.indexOf(t); renderList(); renderDetail(); };
    list.appendChild(el);
  });
}

function refreshRow(id) {
  const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  if (row) row.querySelector(".dot").className = dotClass(id);
  updateProgress();
}

function save(id) {
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {
    const a = annOf(id);
    const status = $("#saved");
    try {
      const r = await fetch("/api/annotate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, ...a, updated: new Date().toISOString() })
      });
      if (!r.ok) throw new Error(await r.text());
      if (status && $("#detail").dataset.id === id) {
        status.textContent = "saved " + new Date().toLocaleTimeString();
      }
    } catch (e) {
      if (status && $("#detail").dataset.id === id) status.textContent = "SAVE FAILED — " + e.message;
    }
  }, 350);
}

function setVerdict(id, v) {
  const a = { ...annOf(id) };
  a.verdict = a.verdict === v ? "" : v;
  ann[id] = a;
  document.querySelectorAll(".verdicts button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.v === a.verdict)));
  refreshRow(id);
  save(id);
}

function renderDetail() {
  const t = traces[cur], d = $("#detail");
  if (!t) { d.innerHTML = '<p class="empty">No trace selected.</p>'; return; }
  const a = annOf(t.id);
  d.dataset.id = t.id;

  const tools = t.tool_calls.length
    ? t.tool_calls.map(tc =>
        `<div class="tool"><b>${tc.tool_name}</b><span>(${JSON.stringify(tc.arguments || {})})</span></div>`
      ).join("")
    : '<div class="tool"><span>no tools called</span></div>';

  d.innerHTML = `
    <div class="card">
      <div class="label">Input · ${t.id}</div>
      <p class="query"></p>
      ${t.probe ? '<div class="probe"></div>' : ""}
      <div class="meta">
        ${t.duration_seconds != null ? `<span>${t.duration_seconds}s</span>` : ""}
        ${t.timestamp ? `<span>${t.timestamp}</span>` : ""}
      </div>
    </div>

    <div class="card">
      <div class="label">Tool calls</div>
      ${tools}
    </div>

    <div class="card">
      <div class="label">Output</div>
      ${t.error ? '<pre class="resp agent-error"></pre>' : '<pre class="resp"></pre>'}
    </div>

    <div class="card">
      <div class="label">Your analysis</div>
      <div class="verdicts">
        <button data-v="error" aria-pressed="${a.verdict === "error"}">Error <kbd>e</kbd></button>
        <button data-v="ok" aria-pressed="${a.verdict === "ok"}">Looks right <kbd>o</kbd></button>
      </div>
      <div class="label">Notes — what went wrong, in your own words</div>
      <textarea id="note" placeholder="Describe the error concretely. Open coding first; cluster into failure modes later."></textarea>
      <div class="saved" id="saved"></div>
    </div>

    <div class="nav">
      <button class="ghost" id="prev">← Previous</button>
      <button class="ghost" id="next">Next →</button>
      <span class="hint"><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>e</kbd>/<kbd>o</kbd> verdict · <kbd>n</kbd> notes</span>
    </div>`;

  d.querySelector(".query").textContent = t.query;
  if (t.probe) d.querySelector(".probe").textContent = "Probing: " + t.probe;
  d.querySelector(".resp").textContent = t.error ? t.error : (t.response || "(empty response)");

  const note = d.querySelector("#note");
  note.value = a.note || "";
  note.addEventListener("input", () => {           // no re-render: focus stays put
    ann[t.id] = { ...annOf(t.id), note: note.value };
    refreshRow(t.id);
    save(t.id);
  });

  d.querySelectorAll(".verdicts button").forEach(b =>
    b.onclick = () => setVerdict(t.id, b.dataset.v));
  d.querySelector("#prev").onclick = () => move(-1);
  d.querySelector("#next").onclick = () => move(1);
}

function move(step) {
  const rows = visible();
  if (!rows.length) return;
  const here = rows.indexOf(traces[cur]);
  const next = here === -1 ? 0 : Math.min(rows.length - 1, Math.max(0, here + step));
  cur = traces.indexOf(rows[next]);
  renderList();
  renderDetail();
  const row = document.querySelector('.row[aria-current="true"]');
  if (row) row.scrollIntoView({ block: "nearest" });
}

document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === "Escape") { document.activeElement.blur(); return; }
  if (typing) return;
  const t = traces[cur];
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "e" && t) setVerdict(t.id, "error");
  else if (e.key === "o" && t) setVerdict(t.id, "ok");
  else if (e.key === "n") { e.preventDefault(); const n = $("#note"); if (n) n.focus(); }
});

document.querySelectorAll(".filters button").forEach(b => {
  b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll(".filters button").forEach(x =>
      x.setAttribute("aria-pressed", String(x === b)));
    const rows = visible();
    if (rows.length && !rows.includes(traces[cur])) cur = traces.indexOf(rows[0]);
    renderList(); renderDetail();
  };
});

function download(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function reviewedRows(scope) {
  const rows = scope === "errors"
    ? traces.filter(t => annOf(t.id).verdict === "error")
    : traces.filter(t => isReviewed(t.id));
  return rows.map(t => {
    const a = annOf(t.id);
    return {
      id: t.id,
      query: t.query,
      probe: t.probe || "",
      verdict: a.verdict || "",
      note: a.note || "",
      tools: t.tool_calls.map(tc => tc.tool_name).join(" "),
      duration_seconds: t.duration_seconds ?? "",
      response: t.response || ""
    };
  });
}

function toCSV(rows) {
  if (!rows.length) return "";
  const cols = Object.keys(rows[0]);
  const esc = v => {
    const s = String(v ?? "");
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [cols.join(","), ...rows.map(r => cols.map(c => esc(r[c])).join(","))].join("\r\n");
}

function toMarkdown(rows) {
  const out = [`# Error analysis\n`, `${rows.length} reviewed of ${traces.length} traces\n`];
  rows.forEach(r => {
    out.push(`## ${r.id} — ${r.query}`);
    out.push(`**Verdict:** ${r.verdict || "—"}  |  **Tools:** ${r.tools || "none"}  |  **${r.duration_seconds}s**\n`);
    if (r.probe) out.push(`_Probe: ${r.probe}_\n`);
    out.push(`**Note:** ${r.note || "_none_"}\n`);
    out.push("<details><summary>Response</summary>\n\n```\n" + r.response + "\n```\n</details>\n");
  });
  return out.join("\n");
}

function runExport(fmt) {
  const scope = $("#scope").value;
  const rows = reviewedRows(scope);
  if (!rows.length) { flashExport("nothing reviewed yet"); return; }
  const stamp = new Date().toISOString().slice(0, 10);
  const base = `error-analysis-${scope}-${stamp}`;
  if (fmt === "csv")       download(`${base}.csv`, toCSV(rows), "text/csv");
  else if (fmt === "json") download(`${base}.json`, JSON.stringify(rows, null, 2), "application/json");
  else                     download(`${base}.md`, toMarkdown(rows), "text/markdown");
  flashExport(`${rows.length} exported`);
}

function flashExport(msg) {
  const el = $("#exportmsg");
  el.textContent = msg;
  setTimeout(() => el.textContent = "", 2200);
}

document.querySelectorAll("[data-export]").forEach(b =>
  b.onclick = () => runExport(b.dataset.export));

$("#copy").onclick = async () => {
  const rows = reviewedRows($("#scope").value);
  if (!rows.length) { flashExport("nothing reviewed yet"); return; }
  try { await navigator.clipboard.writeText(toMarkdown(rows)); flashExport("copied"); }
  catch { console.log(toMarkdown(rows)); flashExport("see console"); }
};

fetch("/api/data").then(r => r.json()).then(d => {
  traces = d.traces; ann = d.annotations || {};
  if (!traces.length) {
    $("#detail").innerHTML = '<p class="empty">No traces found. Run generate_traces.py first.</p>';
    return;
  }
  const firstTodo = traces.findIndex(t => !isReviewed(t.id));
  cur = firstTodo === -1 ? 0 : firstTodo;
  updateProgress(); renderList(); renderDetail();
}).catch(e => {
  $("#detail").innerHTML = '<p class="empty">Could not load traces: ' + e.message + '</p>';
});
</script>
</body>
</html>
